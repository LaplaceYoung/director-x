interface:
  display_name: "Director X Render Composition"
  short_description: "Render verified timelines with synchronized picture and sound"
  default_prompt: "Compile and verify the approved timeline into a playable preview or final render with exact visual, audio, caption, transition, and duration bindings."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "directorx-production"
      description: "Bundled Director X MCP server for render contracts, timeline projection, Remotion, HyperFrames, Director X Cut, FFmpeg, and media verification."
