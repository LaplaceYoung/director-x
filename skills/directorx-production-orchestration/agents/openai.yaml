interface:
  display_name: "Director X Production Orchestration"
  short_description: "Orchestrate an already booted Director X production Run."
  default_prompt: "Load the main Director X entry skill, open its side Browser canvas first, then orchestrate the active production Run."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "directorx-production"
      description: "Bundled Director X MCP server for booting, resuming, and orchestrating the durable production Run."
