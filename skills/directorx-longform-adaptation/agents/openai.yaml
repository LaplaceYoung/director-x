  short_description: "Scale video production across scenes and episodes"
  default_prompt: "Adapt the Director X pipeline for long-form work with episode hierarchy, scene graphs, character memory, camera dependencies, segment handoffs, and bounded review loops."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "directorx-production"
      description: "Bundled Director X MCP server for complexity routing, execution graphs, continuity memory, segment frames, stitching, and long-video review."
