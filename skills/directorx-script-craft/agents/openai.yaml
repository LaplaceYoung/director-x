interface:
  display_name: "Director X Script Craft"
  short_description: "Write platform-native hooks, narration, dialogue, and CTAs"
  default_prompt: "Write a concise video script whose hook, claims, proof, pacing, voice, retention beats, and CTA can be mapped directly into Director X shots."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "directorx-production"
      description: "Bundled Director X MCP server for resolved intent, research evidence, Director documents, claim-proof maps, script artifacts, and stage gates."
