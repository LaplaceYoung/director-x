interface:
  display_name: "Director X Shot Planning"
  short_description: "Turn scripts into executable shots and camera dependencies"
  default_prompt: "Convert the approved script into a budget-aware shotlist with shot function, blocking, lens intent, camera movement, evidence, handles, dependencies, and review targets."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "directorx-production"
      description: "Bundled Director X MCP server for shotlists, claim proof, grounding, scene coverage, camera graphs, continuity, and storyboard artifacts."
