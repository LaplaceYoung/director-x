interface:
  display_name: "Director X Canvas Coordination"
  short_description: "Keep the live media canvas synchronized with the Run"
  default_prompt: "Coordinate the Director X side Browser as a projection of the durable Run, prioritizing playable media, evidence, decisions, and real production progress."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "directorx-production"
      description: "Bundled Director X MCP server for canvas sessions, durable Run snapshots, media relations, interactions, and progress projection."
