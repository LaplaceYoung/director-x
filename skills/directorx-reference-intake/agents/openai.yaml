interface:
  display_name: "Director X Reference Intake"
  short_description: "Extract transferable directing patterns from references"
  default_prompt: "Analyze the supplied reference across every decoded frame and audio evidence, separate transferable patterns from blocked reuse, and hand off an originality-safe plan."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "directorx-production"
      description: "Bundled Director X MCP server for reference consent, ingestion, media evidence, rights boundaries, replication plans, and learning candidates."
