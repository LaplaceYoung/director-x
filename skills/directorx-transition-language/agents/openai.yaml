interface:
  display_name: "Director X Transition Language"
  short_description: "Design motivated visual and audio shot transitions"
  default_prompt: "Compile every adjacent shot boundary into a motivated transition with visual overlap, action or semantic continuity, audio bridges, renderer instructions, fallbacks, and review gates."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "directorx-production"
      description: "Bundled Director X MCP server for shot order, boundary evidence, transition plans, timeline projections, render bindings, and review."
