interface:
  display_name: "Director X Video Reading"
  short_description: "Read videos into timestamped visual evidence"
  default_prompt: "Read the supplied video with the smallest sufficient evidence profile, inspect the returned contact sheet and frames, and report timestamp-grounded observations without overstating coverage."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "directorx-production"
      description: "Bundled Director X MCP server for authorized video ingest, adaptive video reading, transcript evidence, durable Runs, and live canvas projection."
