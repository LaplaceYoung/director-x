<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #151515; color: #f4f1eb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 360px; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid #333; }
    h1 { margin: 0; font-size: 16px; letter-spacing: .02em; }
    #mode { color: #ff876d; font-size: 12px; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 260px; min-height: 300px; }
    #flow { padding: 18px; overflow: auto; }
    #inspector { border-left: 1px solid #333; padding: 18px; }
    .stage { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid #292929; }
    .dot { width: 9px; height: 9px; margin-top: 5px; border-radius: 50%; background: #555; }
    .active .dot { background: #ff6b4a; }
    .ready .dot { background: #56b87a; }
    .label { font-size: 13px; }
    .detail, .meta { color: #aaa; font-size: 11px; margin-top: 4px; }
    .gate { padding: 10px 0; border-bottom: 1px solid #292929; }
    .pending { color: #f3bd65; }
    .approved { color: #56b87a; }
    .empty { color: #999; padding: 20px 0; }
    form { margin-top: 20px; padding-top: 16px; border-top: 1px solid #333; }
    label { display: block; color: #bbb; font-size: 11px; margin: 9px 0 5px; }
    input, button { width: 100%; border: 1px solid #444; background: #202020; color: #f4f1eb; padding: 9px; }
    button { margin-top: 10px; background: #e85d3f; border-color: #e85d3f; cursor: pointer; }
    #credential-status { min-height: 18px; color: #aaa; font-size: 11px; margin-top: 8px; }
    @media (max-width: 640px) { main { grid-template-columns: 1fr; } #inspector { border-left: 0; border-top: 1px solid #333; } }
  </style>
</head>
<body>
  <header><h1>Director X</h1><span id="mode">Goal · 等待载入</span></header>
  <main>
    <section id="flow"><div class="empty">正在连接生产 Run…</div></section>
    <aside id="inspector">
      <strong>确认门</strong><div id="approvals"></div>
      <form id="credential-form">
        <strong>会话凭据</strong>
        <div class="meta">仅注入当前 Director X 进程；不写入项目文件或 Run。</div>
        <label for="provider">供应商 ID</label><input id="provider" autocomplete="off" placeholder="例如 mosi" required />
        <label for="env-name">环境变量</label><input id="env-name" autocomplete="off" value="IMAGE_PROVIDER_API_KEY" required />
        <label for="api-key">API Key</label><input id="api-key" type="password" autocomplete="off" required />
        <button type="submit">注入当前会话</button>
        <div id="credential-status"></div>
      </form>
    </aside>
  </main>
  <script type="module">
    const stages = ["intake", "research", "script", "storyboard", "generation", "edit", "review", "delivery"];
    let snapshot = window.openai?.toolOutput ?? window.openai?.structuredContent ?? null;

    function render(data) {
      if (!data) return;
      snapshot = data;
      document.querySelector("#mode").textContent = `${data.goal?.displayMode ?? "Director X Goal"} · ${data.status}`;
      const current = Math.max(0, stages.indexOf(data.stage));
      document.querySelector("#flow").innerHTML = stages.map((stage, index) => {
        const state = index < current ? "ready" : index === current ? "active" : "pending";
        const latest = [...(data.events ?? [])].reverse().find((item) => item.stage === stage);
        return `<div class="stage ${state}"><span class="dot"></span><div><div class="label">${stage}</div><div class="detail">${latest?.detail ?? "等待执行"}</div></div><span class="meta">${state}</span></div>`;
      }).join("");
      const approvals = data.approvals ?? (data.requiredApprovals ?? []).map((kind) => ({ kind, status: "pending" }));
      document.querySelector("#approvals").innerHTML = approvals.map((gate) => `<div class="gate"><div>${gate.kind}</div><div class="meta ${gate.status}">${gate.status}</div></div>`).join("");
    }

    render(snapshot);
    window.addEventListener("message", (event) => {
      const value = event.data?.structuredContent ?? event.data?.toolOutput;
      if (value) render(value);
    });

    document.querySelector("#credential-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const status = document.querySelector("#credential-status");
      const apiKeyInput = document.querySelector("#api-key");
      status.textContent = "正在注入…";
      try {
        if (!window.openai?.callTool) throw new Error("当前宿主不支持安全画布工具调用");
        const result = await window.openai.callTool("directorx_set_session_credential", {
          providerId: document.querySelector("#provider").value.trim(),
          envName: document.querySelector("#env-name").value.trim(),
          apiKey: apiKeyInput.value
        });
        apiKeyInput.value = "";
        const output = result?.structuredContent ?? result;
        status.textContent = output?.configured ? "已注入当前会话；进程退出后自动失效。" : "注入失败，请重试。";
      } catch (error) {
        apiKeyInput.value = "";
        status.textContent = error instanceof Error ? error.message : String(error);
      }
    });
  </script>
</body>
</html>
