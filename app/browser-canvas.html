<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Director X Production Canvas</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #111; color: #eee; --line: #2c2c2c; --muted: #8a8a8a; --panel: #171717; --raised: #202020; --accent: #ef6548; --good: #6fb68a; --warn: #d8a750; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    .app { height: 100vh; display: grid; grid-template-rows: 52px minmax(0, 1fr); background: #111; }
    header { display: grid; grid-template-columns: 280px 1fr 280px; align-items: center; border-bottom: 1px solid var(--line); background: #151515; padding: 0 14px; }
    .brand, .header-status { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand strong { font-size: 14px; letter-spacing: .01em; white-space: nowrap; }
    .run-label, .header-status { color: var(--muted); font-size: 11px; }
    .header-status { justify-content: flex-end; }
    .view-switch { justify-self: center; display: flex; border: 1px solid #343434; border-radius: 8px; padding: 3px; background: #101010; }
    .view-switch button { border: 0; background: transparent; padding: 7px 14px; border-radius: 6px; color: #8f8f8f; cursor: pointer; font-size: 12px; }
    .view-switch button[aria-pressed="true"] { background: #303030; color: #f5f5f5; }
    .rail-toggle { display: none; border: 1px solid #353535; background: #202020; border-radius: 5px; padding: 6px 8px; font-size: 10px; cursor: pointer; }
    .shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 0; }
    .rail { border-right: 1px solid var(--line); background: #151515; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; min-height: 0; }
    .rail-title { display: flex; justify-content: space-between; align-items: center; padding: 15px 14px 11px; font-size: 12px; }
    .rail-tabs { display: flex; gap: 16px; color: var(--muted); }
    .rail-tabs button { border: 0; padding: 0 0 8px; background: transparent; color: inherit; cursor: pointer; }
    .rail-tabs button.active { color: #eee; border-bottom: 1px solid #eee; }
    .search { margin: 0 12px 10px; border: 1px solid #333; background: #1d1d1d; color: #ddd; width: calc(100% - 24px); padding: 8px 10px; border-radius: 5px; font-size: 11px; outline: none; }
    .search:focus { border-color: #777; }
    .object-list { overflow: auto; padding: 0 7px 12px; }
    .object-item { width: 100%; display: grid; grid-template-columns: 38px minmax(0,1fr); gap: 9px; align-items: center; border: 0; background: transparent; padding: 7px; border-radius: 5px; text-align: left; cursor: pointer; }
    .object-item:hover, .object-item.selected { background: #252525; }
    .object-thumb { width: 38px; height: 38px; border: 1px solid #373737; border-radius: 6px; background: #1d1d1d; display: grid; place-items: center; color: #9a9a9a; font-size: 9px; overflow: hidden; }
    .object-thumb img, .object-thumb video { width: 100%; height: 100%; object-fit: cover; }
    .object-thumb audio { width: 36px; height: 30px; }
    .object-copy { min-width: 0; }
    .object-copy strong { display: block; font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .object-copy small { display: block; color: #777; margin-top: 3px; font-size: 9px; }
    .rail-foot { border-top: 1px solid var(--line); color: #777; font-size: 10px; padding: 10px 14px; }
    .workspace { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #101010; }
    .connection-banner { position: absolute; z-index: 8; top: 10px; left: 50%; transform: translate(-50%, -12px); max-width: min(620px, calc(100% - 28px)); padding: 7px 11px; border: 1px solid #674336; background: #211713; color: #efb09d; font-size: 9px; line-height: 1.45; opacity: 0; pointer-events: none; transition: opacity .16s ease, transform .16s ease; }
    .app[data-connection="stale"] .connection-banner { opacity: 1; transform: translate(-50%, 0); }
    .app[data-connection="stale"] .workspace::after { content: ""; position: absolute; inset: 0; border: 1px solid rgba(239,101,72,.25); pointer-events: none; z-index: 7; }
    .canvas-viewport { position: absolute; inset: 0; overflow: hidden; cursor: grab; }
    .canvas-viewport.dragging { cursor: grabbing; }
    .canvas-plane { position: absolute; width: 2200px; height: 1000px; transform-origin: 0 0; }
    .edge-layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .edge { fill: none; stroke: #3f3f3f; stroke-width: 1.2; }
    .edge.approval { stroke-dasharray: 5 5; stroke: #694c3f; }
    .edge.frame_handoff { stroke: #ba7b48; stroke-width: 2; }
    .edge.agent { stroke-dasharray: 3 4; stroke: #526b62; }
    .node { position: absolute; width: 190px; min-height: 92px; border: 1px solid #343434; background: #1a1a1a; border-radius: 7px; padding: 11px; text-align: left; cursor: pointer; box-shadow: 0 10px 26px rgba(0,0,0,.16); }
    .node:hover, .node.selected { border-color: #777; }
    .node.active { border-color: var(--accent); }
    .node.blocked { border-color: #6b4b31; }
    .node.complete .node-state { color: var(--good); }
    .node.active .node-state { color: var(--accent); }
    .node.blocked .node-state { color: var(--warn); }
    .node-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .node-type { color: #777; font-size: 9px; text-transform: uppercase; letter-spacing: .08em; }
    .node-state { color: #777; font-size: 9px; }
    .node strong { display: block; margin-top: 8px; font-size: 12px; font-weight: 560; }
    .node p { margin: 6px 0 0; color: #909090; font-size: 10px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .node-preview { width: calc(100% + 22px); height: 110px; margin: -11px -11px 10px; object-fit: cover; border-radius: 7px 7px 0 0; border-bottom: 1px solid #333; background: #151515; }
    .toolbar { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 5px; padding: 5px; border: 1px solid #353535; border-radius: 9px; background: #1b1b1b; box-shadow: 0 10px 28px rgba(0,0,0,.28); }
    .toolbar button { border: 0; background: transparent; padding: 7px 10px; border-radius: 5px; color: #aaa; cursor: pointer; font-size: 10px; }
    .toolbar button:hover { background: #303030; color: #fff; }
    .inspector { position: absolute; top: 12px; right: 12px; bottom: 12px; width: 290px; border: 1px solid #333; border-radius: 8px; background: #181818; box-shadow: 0 16px 40px rgba(0,0,0,.35); overflow: auto; padding: 16px; transform: translateX(calc(100% + 24px)); transition: transform .18s ease; }
    .inspector.open { transform: translateX(0); }
    .inspector-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
    .inspector h2 { margin: 0; font-size: 15px; }
    .close { border: 0; background: transparent; color: #888; cursor: pointer; padding: 0; }
    .section { border-top: 1px solid #303030; margin-top: 16px; padding-top: 14px; }
    .section h3 { margin: 0 0 9px; color: #aaa; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .kv { display: grid; grid-template-columns: 74px 1fr; gap: 7px; font-size: 10px; line-height: 1.45; }
    .kv span:nth-child(odd) { color: #777; }
    .credential-toggle { position: absolute; right: 14px; bottom: 18px; border: 1px solid #363636; background: #1b1b1b; border-radius: 7px; padding: 8px 11px; cursor: pointer; color: #aaa; font-size: 10px; }
    form label { display: block; color: #8c8c8c; font-size: 10px; margin: 10px 0 5px; }
    form input, form select { width: 100%; border: 1px solid #383838; background: #212121; color: #eee; padding: 8px; border-radius: 4px; font-size: 11px; }
    form button { width: 100%; margin-top: 11px; border: 0; border-radius: 4px; background: var(--accent); padding: 9px; cursor: pointer; font-size: 11px; }
    .status-copy, .empty { color: #777; font-size: 10px; line-height: 1.5; }
    .document-preview { max-height: 46vh; overflow: auto; white-space: pre-wrap; color: #c8c8c8; background: #101010; border: 1px solid #303030; padding: 10px; font: 10px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .storyboard, .review { position: absolute; inset: 0; overflow: auto; padding: 22px; display: none; }
    .storyboard.open { display: block; }
    .review.open { display: block; }
    .media { position: absolute; inset: 0; overflow: auto; padding: 18px; display: none; }
    .media.open { display: block; }
    .media-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 14px; }
    .media-head h2 { margin: 0; font-size: 15px; }
    .media-head p { margin: 5px 0 0; color: #888; font-size: 10px; }
    .production-pulse { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 11px; align-items: center; margin-bottom: 14px; padding: 11px 13px; border: 1px solid #303030; background: #151515; }
    .production-pulse .pulse-mark { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 4px rgba(111,182,138,.1); }
    .production-pulse strong { display: block; font-size: 11px; font-weight: 560; }
    .production-pulse p { margin: 3px 0 0; color: #858585; font-size: 9px; line-height: 1.45; }
    .production-pulse time { color: #777; font-size: 9px; white-space: nowrap; }
    .production-pulse.on_track .pulse-mark, .production-pulse.awaiting_fast_start .pulse-mark { background: var(--warn); box-shadow: 0 0 0 4px rgba(216,167,80,.1); }
    .production-pulse.breached { border-color: #674336; background: #1b1614; }
    .production-pulse.breached .pulse-mark { background: var(--accent); box-shadow: 0 0 0 4px rgba(239,101,72,.12); }
    .production-pulse.breached strong { color: #f0a18d; }
    .media-stats { display: flex; gap: 6px; flex-wrap: wrap; }
    .media-stat { border: 1px solid #343434; background: #181818; padding: 7px 9px; color: #aaa; font-size: 9px; }
    .media-stat strong { color: #eee; margin-right: 4px; font-size: 12px; }
    .media-preview { display: grid; grid-template-columns: minmax(260px, .9fr) minmax(300px, 1.1fr); gap: 14px; margin-bottom: 16px; }
    .media-preview-panel, .media-relations-panel { border: 1px solid #303030; background: #141414; padding: 13px; }
    .media-preview-panel h3, .media-relations-panel h3 { margin: 0 0 9px; font-size: 11px; color: #bbb; }
    .media-preview-frame { min-height: 180px; display: grid; place-items: center; background: #090909; border: 1px solid #292929; }
    .media-preview-frame video, .media-preview-frame img { max-width: 100%; max-height: 42vh; display: block; }
    .media-preview-frame audio { width: 100%; }
    .media-preview-copy { margin-top: 9px; color: #888; font-size: 10px; line-height: 1.5; }
    .media-graph { position: relative; min-height: 470px; overflow: auto; border: 1px solid #303030; background: #101010; padding: 12px; }
    .media-graph-plane { position: relative; width: 1220px; min-height: 410px; }
    .media-graph .media-edge-layer { position: absolute; inset: 0; width: 1220px; height: 100%; pointer-events: none; overflow: visible; }
    .media-edge { fill: none; stroke: #6f584a; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .media-node { position: absolute; width: 210px; min-height: 118px; border: 1px solid #353535; background: #1a1a1a; border-radius: 7px; padding: 9px; color: #eee; text-align: left; cursor: pointer; }
    .media-node:hover, .media-node.selected { border-color: var(--accent); }
    .media-node .node-preview { width: 100%; height: 78px; margin: 0 0 8px; border-radius: 4px; }
    .media-node strong { display: block; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .media-node small { display: block; margin-top: 4px; color: #777; font-size: 9px; }
    .media-relations { display: flex; flex-wrap: wrap; gap: 6px; max-height: 150px; overflow: auto; }
    .media-relation { border: 1px solid #3c3430; background: #1b1816; color: #bbb; padding: 6px 8px; font-size: 9px; cursor: pointer; }
    .media-relation em { color: var(--accent); font-style: normal; margin: 0 4px; }
    @media (max-width: 760px) { .media-preview { grid-template-columns: 1fr; } .media-head { align-items: start; flex-direction: column; } }
    .story-group { border-top: 1px solid #303030; padding: 15px 0 24px; }
    .story-group h2 { margin: 0 0 13px; font-size: 12px; font-weight: 560; }
    .story-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
    .story-card { min-height: 150px; border: 1px solid #323232; border-radius: 7px; background: #191919; overflow: hidden; text-align: left; padding: 0; cursor: pointer; }
    .story-card .copy { padding: 11px; }
    .story-card strong { display: block; font-size: 11px; }
    .story-card p { color: #858585; font-size: 10px; line-height: 1.45; }
    .story-card img, .story-card video { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #131313; }
    .asset-relations { margin: 14px 0 20px; border-top: 1px solid #303030; border-bottom: 1px solid #303030; padding: 12px 0; }
    .asset-relations h2 { margin: 0 0 8px; font-size: 11px; color: #aaa; }
    .relation-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .relation-item { border: 1px solid #363636; background: #1d1d1d; color: #bdbdbd; padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 9px; }
    .relation-kind { color: var(--accent); margin: 0 5px; }
    .compare-toggle { width: calc(100% - 22px); margin: 0 11px 11px; border: 1px solid #3a3a3a; background: #222; border-radius: 4px; padding: 6px; color: #aaa; cursor: pointer; font-size: 9px; }
    .compare-toggle.active { border-color: var(--accent); color: #fff; }
    .review-picker { display: flex; gap: 7px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; }
    .review-picker button { min-width: 150px; border: 1px solid #343434; background: #1b1b1b; color: #aaa; padding: 8px; text-align: left; cursor: pointer; }
    .review-picker button.active { border-color: var(--accent); color: #fff; }
    .compare-panel { border: 1px solid #343434; background: #151515; margin-bottom: 22px; padding: 14px; }
    .compare-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
    .compare-head h2 { margin: 0; font-size: 12px; }
    .compare-head button, .defect-jump { border: 1px solid #3b3b3b; background: #202020; color: #aaa; padding: 6px 8px; cursor: pointer; font-size: 9px; }
    .compare-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .compare-player { min-width: 0; }
    .compare-player video { width: 100%; max-height: 42vh; background: #090909; }
    .compare-player strong { display: block; margin: 7px 0; font-size: 10px; }
    .defect-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .defect-evidence { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin-top: 7px; }
    .defect-evidence button { border: 1px solid #343434; background: #111; color: #888; padding: 0; text-align: left; cursor: pointer; overflow: hidden; }
    .defect-evidence img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; }
    .defect-evidence small { display: block; padding: 4px; font-size: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lineage { color: #ba8b67; font-size: 9px; margin-top: 5px; }
    .review-timeline { margin-top: 14px; border-top: 1px solid #303030; padding-top: 12px; }
    .timeline-controls { display: flex; align-items: center; gap: 5px; margin-bottom: 9px; }
    .timeline-controls button { border: 1px solid #3a3a3a; background: #202020; color: #aaa; padding: 5px 7px; cursor: pointer; font-size: 9px; }
    .timeline-range { margin-left: auto; color: #777; font-size: 9px; }
    .timeline-row { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px; align-items: center; margin: 7px 0; }
    .timeline-label { color: #777; font-size: 9px; }
    .timeline-track { position: relative; height: 28px; background: #101010; border: 1px solid #303030; overflow: hidden; }
    .waveform { display: flex; align-items: center; gap: 1px; padding: 2px; }
    .waveform i { flex: 1; min-width: 1px; background: #718d83; }
    .timeline-block { position: absolute; top: 3px; bottom: 3px; border: 1px solid #555; background: #292929; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 4px; font-size: 8px; cursor: pointer; }
    .timeline-block.subtitle { top: 6px; bottom: 6px; background: #24302d; border-color: #465d55; }
    .timeline-marker { position: absolute; top: 0; bottom: 0; width: 2px; border: 0; padding: 0; background: var(--warn); cursor: pointer; }
    .timeline-marker.critical, .timeline-marker.major { background: var(--accent); }
    .review-feedback { margin: 0 0 14px; border: 1px solid #303030; background: #141414; padding: 13px; }
    .review-feedback-head { display: flex; justify-content: space-between; gap: 12px; align-items: end; margin-bottom: 10px; }
    .review-feedback-head h3 { margin: 0; font-size: 12px; }
    .review-feedback-head p { margin: 4px 0 0; color: #7f7f7f; font-size: 9px; }
    .review-note-list { display: grid; gap: 6px; margin-bottom: 10px; }
    .review-note { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 8px; border: 1px solid #2f2f2f; background: #191919; }
    .review-note.resolved { opacity: .58; }
    .review-note time, .review-note small { color: #858585; font-size: 9px; }
    .review-note strong { display: block; font-size: 10px; font-weight: 540; line-height: 1.45; }
    .review-note-form { display: grid; grid-template-columns: minmax(150px, 1fr) 120px 110px; gap: 7px; }
    .review-note-form textarea { grid-column: 1 / -1; min-height: 68px; resize: vertical; }
    .review-note-form input, .review-note-form select, .review-note-form textarea { width: 100%; border: 1px solid #383838; background: #202020; color: #eee; padding: 8px; border-radius: 3px; font-size: 10px; }
    .review-note-form button { width: auto; margin-top: 0; border: 0; background: var(--accent); color: #fff; padding: 8px 10px; cursor: pointer; }
    .review-note-form .review-note-submit { grid-column: 3; }
    .review-note-help, .review-note-status { grid-column: 1 / -1; color: #808080; font-size: 9px; line-height: 1.45; }
    @media (max-width: 760px) {
      .review-note-form { grid-template-columns: 1fr; }
      .review-note-form textarea, .review-note-form .review-note-submit, .review-note-help, .review-note-status { grid-column: 1; }
    }
    .evidence-rail { margin-bottom: 16px; border: 1px solid #303030; background: #141414; padding: 12px; }
    .evidence-rail h2 { margin: 0 0 10px; font-size: 12px; color: #d7d7d7; }
    .evidence-query { display: grid; grid-template-columns: minmax(180px, 1fr) 2fr; gap: 12px; padding: 10px 0; border-top: 1px solid #292929; }
    .evidence-query:first-of-type { border-top: 0; }
    .evidence-query strong { display: block; font-size: 11px; }
    .evidence-query small { color: #777; }
    .evidence-hits { display: flex; gap: 7px; overflow-x: auto; }
    .evidence-hit { min-width: 150px; border: 1px solid #383838; background: #202020; color: #aaa; text-align: left; padding: 8px; cursor: pointer; }
    .edit-diff { margin-bottom: 16px; border: 1px solid #3c342d; background: #171513; padding: 12px; }
    .edit-diff-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
    .edit-diff h2 { margin: 0 0 5px; font-size: 12px; }
    .edit-operation { display: grid; grid-template-columns: 90px 1fr auto; gap: 10px; padding: 8px 0; border-top: 1px solid #302b27; font-size: 10px; }
    .edit-operation small { color: #777; }
    .activity { position: absolute; inset: 0; overflow: auto; padding: 22px; display: none; }
    .activity.open { display: block; }
    .coverage { position: absolute; inset: 0; overflow: auto; padding: 22px; display: none; }
    .coverage.open { display: block; }
    .coverage-summary { display: grid; grid-template-columns: minmax(180px, .8fr) minmax(320px, 1.2fr); gap: 18px; margin-bottom: 18px; }
    .coverage-panel, .coverage-scene { border: 1px solid #303030; background: #141414; padding: 14px; }
    .coverage-panel h2, .coverage-scene h2 { margin: 0 0 8px; font-size: 12px; }
    .coverage-score { font-size: 28px; line-height: 1; color: #e7e7e7; }
    .coverage-dimensions { display: grid; grid-template-columns: repeat(5, minmax(90px, 1fr)); gap: 8px; }
    .coverage-dimension { border-top: 1px solid #353535; padding-top: 8px; color: #aaa; font-size: 9px; }
    .coverage-dimension strong { display: block; color: #e0e0e0; font-size: 14px; margin-bottom: 4px; }
    .coverage-scene { margin-bottom: 16px; }
    .coverage-scene-head { display: flex; justify-content: space-between; gap: 16px; align-items: start; margin-bottom: 12px; }
    .coverage-axis { color: #8faaa0; font-size: 9px; text-align: right; }
    .coverage-matrix { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .coverage-matrix span { border: 1px solid #353535; padding: 4px 7px; color: #777; font-size: 9px; }
    .coverage-matrix span.ready { color: #9cb6ab; border-color: #465d55; }
    .coverage-table { width: 100%; min-width: 860px; border-collapse: collapse; table-layout: fixed; font-size: 9px; }
    .coverage-table th { color: #777; text-align: left; font-weight: 500; padding: 6px; border-bottom: 1px solid #353535; }
    .coverage-table td { padding: 8px 6px; border-bottom: 1px solid #262626; vertical-align: top; word-break: break-word; }
    .coverage-table tr { cursor: pointer; }
    .coverage-table tr:hover { background: #1a1a1a; }
    .coverage-table .blocked { color: var(--accent); }
    .coverage-table .active { color: var(--warn); }
    .coverage-table small { display: block; color: #777; margin-top: 3px; }
    .coverage-setups { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }

    .native-callout { border: 1px solid #674a35; background: #1d1916; padding: 13px 15px; margin-bottom: 16px; font-size: 11px; line-height: 1.55; }
    .native-callout strong { color: #efb36d; }
    .activity-grid { display: grid; grid-template-columns: minmax(260px, .8fr) minmax(320px, 1.2fr); gap: 18px; }
    .activity-panel { border-top: 1px solid #353535; padding-top: 12px; }

    .activity-item time, .activity-item .tag { color: #777; }
    .evidence-missing { color: #dfa760; }
    .native-badge { display: inline-block; margin-top: 5px; color: #8faaa0; font-size: 9px; }
    .advanced-details { margin-top: 12px; border-top: 1px solid #2f2f2f; padding-top: 9px; color: #777; font-size: 9px; }
    .advanced-details summary { cursor: pointer; color: #999; user-select: none; }
    .advanced-details pre { white-space: pre-wrap; word-break: break-word; color: #888; line-height: 1.45; }
    .activity-item > .advanced-details { grid-column: 2; }
    .edit-operation > .advanced-details { grid-column: 1 / -1; }
    @media (max-width: 820px) { header { grid-template-columns: 1fr auto; } .view-switch { justify-self: end; } .header-status { display: none; } .shell { grid-template-columns: 210px 1fr; } .inspector { width: min(290px, calc(100% - 24px)); } }
    @media (max-width: 520px) {
      header { grid-template-columns: auto minmax(0,1fr) auto; gap: 7px; padding: 0 8px; }
      .brand { min-width: 0; } .brand strong { font-size: 12px; } .run-label { display: none; }
      .rail-toggle { display: block; }
      .view-switch { justify-self: stretch; } .view-switch button { flex: 1; padding: 6px 8px; }
      .shell { display: block; position: relative; }
      .rail { position: absolute; z-index: 5; top: 0; bottom: 0; left: 0; width: min(260px, calc(100vw - 48px)); transform: translateX(-100%); transition: transform .18s ease; box-shadow: 14px 0 32px rgba(0,0,0,.35); }
      .rail.open { transform: translateX(0); }
      .workspace { width: 100%; height: 100%; }
      .toolbar { left: 10px; transform: none; bottom: 12px; max-width: calc(100% - 20px); }
      .toolbar button { padding: 7px 8px; }
      .credential-toggle { right: 10px; bottom: 58px; }
      .activity-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <button class="rail-toggle" id="rail-toggle">内容</button><div class="brand"><strong>Director X</strong><span class="run-label" id="run-label">正在打开制作空间…</span></div>
      <nav class="view-switch" aria-label="画布视图"><button data-view="media" aria-pressed="true">媒体关系</button><button data-view="review" aria-pressed="false">审片</button><button data-view="activity" aria-pressed="false">活动</button></nav>
      <div class="header-status"><span id="mode">Director X Goal</span><span id="sync">同步中</span></div>
    </header>
    <div class="shell">
      <aside class="rail">
        <div class="rail-title"><div class="rail-tabs"><button class="active" data-filter="all">流程</button><button data-filter="asset">资产</button></div><span id="asset-count">0</span></div>
        <input class="search" id="search" type="search" placeholder="搜索制作对象" />
        <div class="object-list" id="object-list"><div class="empty">正在读取制作对象…</div></div>
        <div class="rail-foot" id="rail-foot">正在准备制作内容</div>
      </aside>
      <main class="workspace">
        <div class="connection-banner" id="connection-banner" role="status" aria-live="polite">画布连接暂时中断，正在保留当前内容并自动恢复。</div>
        <div class="canvas-viewport" id="viewport"><div class="canvas-plane" id="plane"><svg class="edge-layer" id="edges" aria-hidden="true"></svg><div id="nodes"></div></div></div>
        <section class="media" id="media"></section>
        <section class="coverage" id="coverage"></section>
        <section class="storyboard" id="storyboard"></section>
        <section class="review" id="review"></section>
        <section class="activity" id="activity"></section>
        <div class="toolbar" id="toolbar"><button id="fit">适配画布</button><button id="zoom-out">缩小</button><button id="zoom-label">72%</button><button id="zoom-in">放大</button></div>
        <button class="credential-toggle" id="credential-toggle">模型与凭据</button>
        <aside class="inspector" id="inspector"><div class="inspector-head"><h2 id="inspector-title">制作对象</h2><button class="close" id="close-inspector">关闭</button></div><div id="inspector-body"></div></aside>
      </main>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const session = params.get("session");
    const claimToken = params.get("claim");
    const legacyViewportStorageKey = `directorx:viewport:${session ?? "preflight"}`;
    const state = { data: null, selectedId: null, compareIds: [], syncLocked: true, syncLeader: null, reviewTransport: { currentTime: 0, playing: false, playbackRate: 1, direction: 1, loopRange: null, activeArtifactRef: null }, reviewSessionRevision: null, storySignature: null, reviewSignature: null, mediaSignature: null, timelineRevision: null, timelineViewport: null, waveformWindow: null, waveformLoading: false, waveformError: null, waveformRequest: 0, view: "media", filter: "asset", query: "", transform: { x: 0, y: 0, zoom: .72 }, uiStateInitialized: false, uiPersistTimer: null, pendingUiState: null, viewportInitialized: false, viewportRestored: false, dragging: false, pointer: null, refreshInFlight: false, lastSuccessfulSyncAt: null };
    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char]);
    const surfaceUrl = (path, values = {}) => { const query = new URLSearchParams({ session, claim: claimToken }); for (const [key, value] of Object.entries(values)) if (value !== undefined && value !== null) query.set(key, String(value)); return `${path}?${query}`; };
    const claimHeaders = (headers = {}) => ({ ...headers, "X-DirectorX-Claim": claimToken });
    const stageLabel = (stage) => ({ intake: "明确方向", research: "收集资料", script: "打磨脚本", storyboard: "设计镜头", generation: "生成素材", edit: "剪辑合成", review: "检查成片", delivery: "准备交付" })[stage] ?? "制作中";
    const statusLabel = (status) => ({ pending: "等待开始", active: "正在进行", ready: "正在进行", production_in_progress: "正在进行", blocked: "等待确认", complete: "已完成", failed: "需要处理", awaiting_approval: "等待确认" })[status] ?? "制作中";
    const advancedDetails = (summary, value) => `<details class="advanced-details"><summary>${escapeHtml(summary)}</summary><pre>${escapeHtml(typeof value === "string" ? value : JSON.stringify(value ?? {}, null, 2))}</pre></details>`;
    const mediaMarkup = (node, className = "") => {
      const rawUri = node.previewUri || (node.artifactRef && node.metadata?.path ? node.metadata.path : "");
      if (!rawUri) return "";
      const uri = escapeHtml(/^https?:|^data:/.test(rawUri) ? rawUri : surfaceUrl("/directorx/api/media", { path: rawUri }));
      if (node.type === "video") return `<video class="${className}" src="${uri}" muted playsinline preload="metadata"></video>`;
      if (node.type === "image" || node.type === "shot") return `<img class="${className}" src="${uri}" alt="${escapeHtml(node.label)}" />`;
      if (node.type === "audio") return `<audio class="${className}" src="${uri}" controls preload="metadata"></audio>`;
      return "";
    };
    function visibleNodes() {
      const canvas = state.data?.productionCanvas;
      const nodes = state.filter === "asset" || state.view === "media" ? canvas?.assets ?? [] : state.view === "coverage" ? canvas?.sceneCoverage?.shots ?? [] : state.view === "continuity" ? canvas?.cameraContinuity?.nodes ?? [] : canvas?.workflow?.nodes ?? canvas?.nodes ?? [];
      return nodes.filter((node) => {
        const text = `${node.label} ${node.detail ?? ""} ${node.stage ?? ""}`.toLowerCase();
        return text.includes(state.query.toLowerCase());
      });
    }
    function render(data) {
      state.data = data;
      const canvas = data.productionCanvas;
      if (!canvas) return;
      ensureTimelineViewport(canvas.reviewTimeline);
      syncReviewSession(canvas.reviewSession);
      initializeUiState(data.runId, canvas, data.canvas?.uiState);
      applyViewState();
      const friendly = data.userFacingSummary;
      $("#mode").textContent = `${friendly?.stageLabel ?? stageLabel(data.stage)} · ${friendly?.statusLabel ?? statusLabel(data.status)}`;
      const surfaceStatus = data.canvasSurfaceHealth?.status ?? "connected";
      updateConnectionState(surfaceStatus);
      $("#run-label").textContent = data.goal?.outcome ?? "制作空间";
      $("#asset-count").textContent = canvas.summary.assetCount;
      const creativeSla = canvas.summary.creativeProgressSla;
      $("#rail-foot").textContent = creativeSla?.breached ? creativeSla.userFacingMessage : friendly?.headline ?? `当前正在${stageLabel(data.stage)}`;
      renderObjectList(); renderGraph(); renderMediaBoard(); renderCoverage(); renderStoryboard(); renderReview(); renderActivity(); updateTransform();
    }
    function renderObjectList() {
      const nodes = visibleNodes();
      $("#object-list").innerHTML = nodes.length ? nodes.map((node) => `<button class="object-item ${state.selectedId === node.id ? "selected" : ""}" data-node-id="${escapeHtml(node.id)}"><span class="object-thumb">${mediaMarkup(node) || escapeHtml(shortType(node.type))}</span><span class="object-copy"><strong>${escapeHtml(node.label)}</strong><small>${escapeHtml(stageLabel(node.stage))} · ${escapeHtml(statusLabel(node.status))}</small></span></button>`).join("") : '<div class="empty">当前没有需要查看的内容。</div>';
    }
    function renderGraph() {
      const canvas = state.data.productionCanvas;
      const graph = state.view === "media" ? canvas.mediaGraph ?? { nodes: [], edges: [] } : state.view === "continuity" ? canvas.cameraContinuity ?? { nodes: [], edges: [] } : canvas.workflow ?? { nodes: canvas.nodes, edges: [] };
      $("#nodes").innerHTML = graph.nodes.map((node) => `<button class="node ${escapeHtml(node.status)} ${state.selectedId === node.id ? "selected" : ""}" data-node-id="${escapeHtml(node.id)}" style="left:${Number(node.x)}px;top:${Number(node.y)}px">${mediaMarkup(node, "node-preview")}<span class="node-head"><span class="node-type">${escapeHtml(shortType(node.type))}</span><span class="node-state">${escapeHtml(statusLabel(node.status))}</span></span><strong>${escapeHtml(node.label)}</strong><p>${escapeHtml(node.detail ?? "等待制作")}</p></button>`).join("");
      const maxX = Math.max(2200, ...graph.nodes.map((node) => Number(node.x) + 260)), maxY = Math.max(900, ...graph.nodes.map((node) => Number(node.y) + 180));
      $("#plane").style.width = `${maxX}px`; $("#plane").style.height = `${maxY}px`;
      const byId = new Map(graph.nodes.map((node) => [node.id, node]));
      $("#edges").innerHTML = graph.edges.map((edge) => {
        const source = byId.get(edge.source), target = byId.get(edge.target); if (!source || !target) return "";
        const vertical = Math.abs(target.x - source.x) < 80;
        if (vertical) { const x = source.x + 95, y1 = source.y + 92, y2 = target.y, mid = (y1 + y2) / 2; return `<path class="edge ${escapeHtml(edge.kind)}" d="M ${x} ${y1} C ${x} ${mid}, ${x} ${mid}, ${x} ${y2}" />`; }
        const x1 = source.x + 190, y1 = source.y + 46, x2 = target.x, y2 = target.y + 46, mid = (x1 + x2) / 2;
        return `<path class="edge ${escapeHtml(edge.kind)}" d="M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}" />`;
      }).join("");
    }
    function renderPlayablePreview(node) {
      if (!node) return '<div class="empty">选择一个图片、视频或音频文件开始预览。</div>';
      const uri = mediaUri(node);
      if (node.type === "video") return `<video src="${uri}" controls playsinline preload="metadata"></video>`;
      if (node.type === "image") return `<img src="${uri}" alt="${escapeHtml(node.label)}" />`;
      if (node.type === "audio") return `<audio src="${uri}" controls preload="metadata"></audio>`;
      return `<div class="status-copy">${escapeHtml(node.detail ?? node.label)}</div>`;
    }
    function renderMediaBoard() {
      const canvas = state.data?.productionCanvas;
      if (!canvas) return;
      const graph = canvas.mediaGraph ?? { nodes: canvas.assets ?? [], edges: [] };
      const creativeSla = canvas.summary.creativeProgressSla;
      const pulse = $("#production-pulse");
      if (pulse) pulse.outerHTML = renderProductionPulse(creativeSla);
      const signature = JSON.stringify({ nodes: graph.nodes.map((node) => [node.id, node.status, node.previewUri, node.updatedAt]), edges: graph.edges.map((edge) => [edge.id, edge.kind]), selectedId: state.selectedId });
      if (signature === state.mediaSignature) return;
      state.mediaSignature = signature;
      const selected = graph.nodes.find((node) => node.id === state.selectedId) ?? graph.nodes.find((node) => ["video", "audio"].includes(node.type)) ?? graph.nodes[0];
      const counts = graph.counts ?? {};
      const stats = [["视频", counts.video ?? 0], ["音频", counts.audio ?? 0], ["图片", counts.image ?? 0], ["文档", counts.document ?? 0]].map(([label, count]) => `<span class="media-stat"><strong>${escapeHtml(count)}</strong>${label}</span>`).join("");
      const relations = graph.edges.length ? graph.edges.map((edge) => `<button class="media-relation" data-node-id="${escapeHtml(edge.target)}"><span>${escapeHtml(edge.sourceLabel ?? edge.source)}</span><em>→ ${escapeHtml(relationLabel(edge.kind))} →</em><span>${escapeHtml(edge.targetLabel ?? edge.target)}</span></button>`).join("") : '<span class="empty">文件之间还没有已登记的来源、生成、配音或剪辑关系。</span>';
      const nodes = graph.nodes.map((node) => `<button class="media-node ${state.selectedId === node.id ? "selected" : ""}" data-node-id="${escapeHtml(node.id)}" style="left:${Number(node.x)}px;top:${Number(node.y)}px">${mediaMarkup(node, "node-preview")}<strong>${escapeHtml(node.label)}</strong><small>${escapeHtml(shortType(node.type))} · ${escapeHtml(statusLabel(node.status))}</small></button>`).join("");
      const byId = new Map(graph.nodes.map((node) => [node.id, node]));
      const edges = graph.edges.map((edge) => { const source = byId.get(edge.source), target = byId.get(edge.target); if (!source || !target) return ""; const x1 = source.x + 210, y1 = source.y + 58, x2 = target.x, y2 = target.y + 58, mid = (x1 + x2) / 2; return `<path class="media-edge" d="M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}" />`; }).join("");
      $("#media").innerHTML = `<div class="media-head"><div><h2>媒体关系</h2><p>只展示真实登记的图片、视频、音频和必要文档；点击节点可播放并查看来源关系。</p></div><div class="media-stats">${stats}</div></div>${renderProductionPulse(creativeSla)}<div class="media-preview"><section class="media-preview-panel"><h3>预览 · ${escapeHtml(selected?.label ?? "尚未选择")}</h3><div class="media-preview-frame">${renderPlayablePreview(selected)}</div><div class="media-preview-copy">${escapeHtml(selected?.detail ?? "生成或抓取到的媒体会出现在这里。")}</div></section><section class="media-relations-panel"><h3>文件关系 · ${graph.edges.length}</h3><div class="media-relations">${relations}</div></section></div><section class="media-graph"><div class="media-graph-plane"><svg class="media-edge-layer" aria-hidden="true">${edges}</svg>${nodes || '<div class="empty">还没有可预览的媒体文件。</div>'}</div></section>`;
    }
    function renderProductionPulse(sla) {
      const status = sla?.status ?? "awaiting_fast_start";
      const copy = status === "breached"
        ? { title: "创作产出已停滞", detail: sla.userFacingMessage ?? "正在要求制作团队立即恢复真实产物输出。" }
        : status === "satisfied"
          ? { title: "创作产出持续更新", detail: `画布已登记 ${sla.creativeArtifactCount} 项创作内容，继续并行推进资料、脚本和媒体。` }
          : status === "on_track"
            ? { title: "首批创作内容生成中", detail: `目标是在 ${sla.thresholdMinutes ?? 5} 分钟内显示脚本、图片、视频或音频。` }
            : { title: "等待进入快速生产", detail: "完成必要确认后，资料、脚本和资产将立即并行出现。" };
      const timing = sla?.latestCreativeArtifactAt ? `最近更新 ${formatRelativeMinutes(sla.elapsedMinutes)}` : sla?.elapsedMinutes !== undefined ? `已等待 ${formatRelativeMinutes(sla.elapsedMinutes)}` : "尚未开始";
      return `<section class="production-pulse ${escapeHtml(status)}" id="production-pulse"><span class="pulse-mark" aria-hidden="true"></span><div><strong>${escapeHtml(copy.title)}</strong><p>${escapeHtml(copy.detail)}</p></div><time>${escapeHtml(timing)}</time></section>`;
    }
    function formatRelativeMinutes(value) { const minutes = Number(value ?? 0); return minutes < 1 ? "不足 1 分钟" : `${Math.floor(minutes)} 分钟前`; }
    function renderCoverage() {
      const coverage = state.data.productionCanvas.sceneCoverage;
      if (!coverage) { $("#coverage").innerHTML = '<div class="empty">镜头表确定后，这里会按场景显示摄影覆盖、机位、布光和剪辑余量。</div>'; return; }
      const dimensionLabels = { coverageCompleteness: "覆盖完整", spatialContinuity: "空间连续", editSafety: "剪辑安全", compositionDepth: "构图层次", setupEfficiency: "执行效率" };
      const dimensions = `<div class="coverage-dimensions">${Object.entries(coverage.dimensions).map(([key, value]) => `<div class="coverage-dimension"><strong>${escapeHtml(value)}</strong>${escapeHtml(dimensionLabels[key] ?? key)}</div>`).join("")}</div>`;
      const issues = [...coverage.blockers, ...coverage.warnings];
      const summary = `<div class="coverage-summary"><section class="coverage-panel"><h2>摄影覆盖状态</h2><div class="coverage-score">${escapeHtml(coverage.overallScore ?? "—")}</div><div class="status-copy">${coverage.status === "ready" ? "场景覆盖已经可以进入生成。" : `还有 ${coverage.blockers.length} 个问题需要先修正。`}</div></section><section class="coverage-panel"><h2>导演检查维度</h2>${dimensions}</section></div>`;
      const scenes = coverage.scenes.map((scene) => {
        const matrix = Object.entries(scene.coverageMatrix ?? {}).map(([key, ready]) => `<span class="${ready ? "ready" : ""}">${escapeHtml(({ geography: "空间", action: "动作", reaction: "反应", proof: "证明", editSafety: "安全镜头" })[key] ?? key)} · ${ready ? "已覆盖" : "缺失"}</span>`).join("");
        const rows = scene.shots.map((node) => { const shot = node.metadata, shotIssues = issues.filter((item) => item.shotIds?.includes(shot.shotId)); return `<tr data-node-id="${escapeHtml(node.id)}"><td class="${escapeHtml(node.status)}"><strong>${escapeHtml(shot.shotId)}</strong><small>${escapeHtml(shot.coverageRole)}</small></td><td>${escapeHtml(shot.shotSize)} · ${escapeHtml(shot.lensMm)}mm<small>${escapeHtml(shot.lensIntent ?? "")}</small></td><td>${escapeHtml(shot.cameraSide)} / ${escapeHtml(shot.cameraHeight)}<small>${escapeHtml(shot.cameraAzimuthDegrees)}° · ${escapeHtml(shot.cameraDistanceMeters)}m</small></td><td>${escapeHtml(shot.movement)}<small>${escapeHtml(shot.blocking?.length ? `${shot.blocking.length} 个主体调度` : "无主体调度")}</small></td><td>${escapeHtml(shot.lighting?.keyDirection)}<small>${escapeHtml(shot.lighting?.colorTemperatureK)}K</small></td><td>${escapeHtml(shot.handles?.headSeconds)}s / ${escapeHtml(shot.handles?.tailSeconds)}s<small>${shot.fallbackShotId ? `备用 ${escapeHtml(shot.fallbackShotId)}` : "无备用镜头"}</small></td><td>${shotIssues.length ? shotIssues.map((item) => escapeHtml(item.code)).join(" · ") : "可执行"}</td></tr>`; }).join("");
        return `<section class="coverage-scene"><div class="coverage-scene-head"><div><h2>${escapeHtml(scene.sceneId)} · ${escapeHtml(scene.purpose)}</h2><div class="status-copy">${escapeHtml(scene.shots.length)} 个镜头</div></div><div class="coverage-axis">${escapeHtml(scene.axisType)} · ${escapeHtml(scene.axisId)}<br>${escapeHtml(scene.defaultScreenDirection)}</div></div><div class="coverage-matrix">${matrix}</div><table class="coverage-table"><thead><tr><th>镜头</th><th>景别/焦段</th><th>机位</th><th>运动/调度</th><th>光线</th><th>头尾余量</th><th>检查</th></tr></thead><tbody>${rows}</tbody></table></section>`;
      }).join("");
      const setups = `<section class="coverage-panel"><h2>摄影设置与执行波次</h2><div class="coverage-setups">${coverage.setupGroups.map((group) => `<div class="coverage-setup"><strong>${escapeHtml(group.setupId)} · ${escapeHtml(group.shotIds.join(" / "))}</strong>${escapeHtml(group.executionNote)}</div>`).join("") || '<div class="empty">尚未形成摄影设置。</div>'}</div>${advancedDetails("执行波次", coverage.executionWaves)}</section>`;
      $("#coverage").innerHTML = summary + scenes + setups;
    }
    function renderStoryboard() {
      const assets = state.data.productionCanvas.assets;
      const relations = state.data.productionCanvas.assetRelations ?? [];
      const signature = JSON.stringify({ assets: assets.map((node) => [node.id, node.type, node.status, node.previewUri, node.updatedAt]), relations: relations.map((edge) => [edge.id, edge.kind]) });
      if (signature === state.storySignature) return;
      state.storySignature = signature;
      const groups = [
        ["文档", assets.filter((node) => node.type === "document")],
        ["图片", assets.filter((node) => node.type === "image")],
        ["视频", assets.filter((node) => node.type === "video")],
        ["音频", assets.filter((node) => node.type === "audio")]
      ];
      const relationMap = relations.length ? `<section class="asset-relations"><h2>内容如何组成成片 · ${relations.length}</h2><div class="relation-list">${relations.map((edge) => `<button class="relation-item" data-node-id="${escapeHtml(edge.target)}"><span>${escapeHtml(edge.sourceLabel ?? edge.source)}</span><span class="relation-kind">→ ${escapeHtml(relationLabel(edge.kind))} →</span><span>${escapeHtml(edge.targetLabel ?? edge.target)}</span></button>`).join("")}</div></section>` : '<section class="asset-relations"><h2>内容关系</h2><div class="empty">脚本、画面、声音和成片之间的关系会显示在这里。</div></section>';
      const cards = `<div class="status-copy">这里集中展示值得查看和使用的文档、图片、视频与声音。</div>${relationMap}${groups.map(([label, items]) => `<div class="story-group"><h2>${label} · ${items.length}</h2><div class="story-grid">${items.length ? items.map((node) => `<article class="story-card" data-node-id="${escapeHtml(node.id)}">${mediaMarkup(node)}<span class="copy"><strong>${escapeHtml(node.label)}</strong><p>${escapeHtml(node.detail ?? stageLabel(node.stage))}</p>${node.metadata?.repairLineage ? `<div class="lineage">已根据审片意见修复</div>` : ""}</span></article>`).join("") : `<div class="empty">当前没有${label}内容。</div>`}</div></div>`).join("")}`;
      $("#storyboard").innerHTML = cards;

    function shortType(type) { return ({ stage: "阶段", brief: "需求", approval: "确认", agent: "制作成员", image: "图片", video: "视频", audio: "音频", shot: "镜头", document: "文档", artifact: "制作记录", decision: "选择" })[type] ?? "制作内容"; }
    function relationLabel(kind) { return ({ derived_from: "来自", frame_handoff: "画面衔接", evidence: "参考依据", dependency: "先后关系", candidate: "备选", edit: "剪辑" })[kind] ?? "关联"; }
    async function selectNode(id) {
      const canvas = state.data?.productionCanvas;
      const node = [...(canvas?.workflow?.nodes ?? []), ...(canvas?.sceneCoverage?.shots ?? []), ...(canvas?.cameraContinuity?.nodes ?? []), ...(canvas?.assets ?? []), ...(canvas?.nodes ?? [])].find((item) => item.id === id); if (!node) return;

      $("#inspector").classList.add("open");

        const target = $("#document-preview"); target.innerHTML = '<div class="status-copy">正在读取文档…</div>';
        try { const response = await fetch(surfaceUrl("/directorx/api/media", { path: node.metadata.path }), { cache: "no-store" }); if (!response.ok) throw new Error(`HTTP ${response.status}`); target.innerHTML = `<pre class="document-preview">${escapeHtml(await response.text())}</pre>`; }
        catch (error) { target.innerHTML = `<div class="status-copy">文档预览不可用：${escapeHtml(error.message ?? String(error))}</div>`; }

    }
    async function openCredentialPanel() {
      $("#inspector-title").textContent = "连接生成模型";
      $("#inspector-body").innerHTML = `<div class="status-copy">这里连接你已经确认使用的图片、视频或配音服务。密钥只在本次制作期间使用，不写入项目文件；关闭或重启后会自动清除。</div><div class="status-copy">需要中文配音时优先推荐 MOSI：<a href="https://platform.mosi.cn" target="_blank" rel="noreferrer">前往 MOSI 开放平台创建 Key</a>。</div><div id="configured-credentials" class="status-copy">正在读取连接状态…</div><form id="credential-form"><label for="provider">选择服务</label><select id="provider" required><option value="">正在读取…</option></select><input id="env-name" type="hidden" required /><label for="api-key">API Key</label><input id="api-key" type="password" autocomplete="new-password" required /><button type="submit">连接本次制作（不保存）</button><div id="credential-status" class="status-copy"></div></form>`;
      $("#inspector").classList.add("open");
      $("#credential-form").addEventListener("submit", submitCredential);
      try { const response = await fetch(surfaceUrl("/directorx/api/credential-status")); const result = await response.json(); if (!response.ok) throw new Error(result.error); $("#configured-credentials").textContent = result.credentials.length ? `已连接 ${result.credentials.length} 项服务，仅在本次制作中有效。` : "当前还没有连接生成服务。"; const provider = $("#provider"), choices = result.availableCredentials ?? []; provider.innerHTML = choices.map((item) => `<option value="${escapeHtml(item.providerId)}" data-env-name="${escapeHtml(item.envName)}">${escapeHtml(item.displayName)}${item.recommended ? " · 推荐" : ""}</option>`).join(""); const syncEnv = () => { $("#env-name").value = provider.selectedOptions[0]?.dataset.envName ?? ""; }; provider.addEventListener("change", syncEnv); syncEnv(); }
      catch (error) { $("#configured-credentials").textContent = error.message ?? String(error); }
    }
    async function submitCredential(event) {
      event.preventDefault(); const key = $("#api-key"), status = $("#credential-status"); status.textContent = "正在注入…";
      try { const response = await fetch("/directorx/api/credential", { method: "POST", headers: claimHeaders({ "Content-Type": "application/json" }), body: JSON.stringify({ session, providerId: $("#provider").value.trim(), envName: $("#env-name").value.trim(), apiKey: key.value }) }); const result = await response.json(); key.value = ""; if (!response.ok) throw new Error(result.error); status.textContent = "连接成功，只在本次制作中有效。"; $("#configured-credentials").textContent = "生成服务已经可以使用。"; }
      catch (error) { key.value = ""; status.textContent = error.message ?? String(error); }
    }
    function uiStorageKey(runId = state.data?.runId) { return `directorx:canvas-ui:${runId ?? "preflight"}`; }
    function initializeUiState(runId, canvas, durableUiState) {
      if (state.uiStateInitialized) return;
      try {
        const localUiState = JSON.parse(localStorage.getItem(uiStorageKey(runId)) ?? "null");
        const localUpdatedAt = Date.parse(localUiState?.updatedAt ?? "") || 0, durableUpdatedAt = Date.parse(durableUiState?.updatedAt ?? "") || 0;
        const saved = localUpdatedAt >= durableUpdatedAt ? localUiState : durableUiState;
        const legacyViewport = JSON.parse(localStorage.getItem(legacyViewportStorageKey) ?? "null");
        const transform = saved?.transform ?? legacyViewport;
        if (transform && [transform.x, transform.y, transform.zoom].every(Number.isFinite) && transform.zoom >= .25 && transform.zoom <= 1.6) { state.transform = transform; state.viewportRestored = true; }
        else if (canvas.viewport) state.transform = { ...canvas.viewport };
        if (["media", "workflow", "coverage", "continuity", "storyboard", "review", "activity"].includes(saved?.view)) state.view = saved.view;
        if (["all", "asset"].includes(saved?.filter)) state.filter = saved.filter;
        if (typeof saved?.query === "string") state.query = saved.query.slice(0, 200);
        if (typeof saved?.syncLocked === "boolean") state.syncLocked = saved.syncLocked;
        if (Number.isFinite(saved?.reviewCurrentTime) && saved.reviewCurrentTime >= 0) state.reviewTransport.currentTime = saved.reviewCurrentTime;
        if (saved?.timelineViewport && Number.isFinite(saved.timelineViewport.start) && Number.isFinite(saved.timelineViewport.duration) && saved.timelineViewport.start >= 0 && saved.timelineViewport.duration > 0) state.timelineViewport = saved.timelineViewport;
        const validIds = new Set([...(canvas.workflow?.nodes ?? canvas.nodes ?? []), ...(canvas.sceneCoverage?.shots ?? []), ...(canvas.cameraContinuity?.nodes ?? []), ...(canvas.assets ?? [])].map((item) => item.id));
        if (validIds.has(saved?.selectedId)) state.selectedId = saved.selectedId;
        state.compareIds = Array.isArray(saved?.compareIds) ? saved.compareIds.filter((id) => validIds.has(id)).slice(0, 2) : state.compareIds;
      } catch { if (canvas.viewport) state.transform = { ...canvas.viewport }; }
      const timelineDuration = canvas.reviewTimeline?.durationSeconds;
      if (state.timelineViewport && Number.isFinite(timelineDuration)) {
        state.timelineViewport.duration = Math.min(timelineDuration, state.timelineViewport.duration);
        state.timelineViewport.start = Math.max(0, Math.min(state.timelineViewport.start, timelineDuration - state.timelineViewport.duration));
      }
      state.uiStateInitialized = true;
      state.viewportInitialized = true;
    }
    function persistUiState() {
      state.viewportRestored = true;
      if (!state.uiStateInitialized) return;
      const value = { version: 1, transform: state.transform, view: state.view, filter: state.filter, query: state.query, selectedId: state.selectedId, compareIds: state.compareIds, syncLocked: state.syncLocked, timelineViewport: state.timelineViewport, reviewCurrentTime: state.reviewTransport.currentTime, updatedAt: new Date().toISOString() };
      state.pendingUiState = value;
      try { localStorage.setItem(uiStorageKey(), JSON.stringify(value)); } catch {}
      clearTimeout(state.uiPersistTimer); state.uiPersistTimer = setTimeout(() => void flushUiState(), 120);
    }
    async function flushUiState() { const uiState = state.pendingUiState; state.pendingUiState = null; clearTimeout(state.uiPersistTimer); if (!session || !uiState || !state.data?.runId) return; try { await fetch("/directorx/api/canvas-ui-state", { method: "POST", headers: claimHeaders({ "Content-Type": "application/json" }), body: JSON.stringify({ session, uiState }), cache: "no-store", keepalive: true }); } catch {} }
    function persistViewport() { persistUiState(); }
    function applyViewState() {
      document.querySelectorAll("[data-view]").forEach((item) => item.setAttribute("aria-pressed", String(item.dataset.view === state.view)));
      document.querySelectorAll("[data-filter]").forEach((item) => item.classList.toggle("active", item.dataset.filter === state.filter));
      $("#search").value = state.query;
      $("#viewport").style.display = ["workflow", "continuity"].includes(state.view) ? "block" : "none";
      $("#toolbar").style.display = ["workflow", "continuity"].includes(state.view) ? "flex" : "none";
      $("#media").classList.toggle("open", state.view === "media");
      $("#coverage").classList.toggle("open", state.view === "coverage");
      $("#storyboard").classList.toggle("open", state.view === "storyboard");
      $("#review").classList.toggle("open", state.view === "review");
      $("#activity").classList.toggle("open", state.view === "activity");
    }
    function updateTransform() { $("#plane").style.transform = `translate(${state.transform.x}px, ${state.transform.y}px) scale(${state.transform.zoom})`; $("#zoom-label").textContent = `${Math.round(state.transform.zoom * 100)}%`; }
    function zoomAroundPoint(nextZoom, clientX, clientY) {
      const rect = $("#viewport").getBoundingClientRect(), pointX = clientX - rect.left, pointY = clientY - rect.top;
      const worldX = (pointX - state.transform.x) / state.transform.zoom, worldY = (pointY - state.transform.y) / state.transform.zoom;
      state.transform = { zoom: nextZoom, x: pointX - worldX * nextZoom, y: pointY - worldY * nextZoom };
      updateTransform(); persistViewport();
    }
    function fitCanvas() {
      const canvas = state.data?.productionCanvas, nodes = state.view === "media" ? canvas?.mediaGraph?.nodes ?? [] : state.view === "continuity" ? canvas?.cameraContinuity?.nodes ?? [] : canvas?.workflow?.nodes ?? canvas?.nodes ?? []; if (!nodes.length) return;
      const minX = Math.min(...nodes.map((n) => n.x)), minY = Math.min(...nodes.map((n) => n.y)), maxX = Math.max(...nodes.map((n) => n.x + 190)), maxY = Math.max(...nodes.map((n) => n.y + 140));
      const rect = $("#viewport").getBoundingClientRect(), zoom = Math.min(.95, Math.max(.28, Math.min((rect.width - 100) / (maxX - minX), (rect.height - 100) / (maxY - minY))));
      state.transform = { zoom, x: (rect.width - (maxX - minX) * zoom) / 2 - minX * zoom, y: (rect.height - (maxY - minY) * zoom) / 2 - minY * zoom }; updateTransform(); persistViewport();
    }
    async function surfaceHeartbeat(event = "heartbeat") {
      if (!session) return;
      try {
        await fetch("/directorx/api/surface-heartbeat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session, claimToken, surface: "canvas", visibility: document.visibilityState, event }),
          cache: "no-store",
          keepalive: true
        });
      } catch {}
    }
    function updateConnectionState(status, error = null) {
      const stale = status === "stale" || status === "disconnected";
      $(".app").dataset.connection = stale ? "stale" : status;
      $("#sync").textContent = status === "hidden" ? "后台保持" : stale ? "正在恢复" : "已同步";
      if (!stale) return;
      const lastSync = state.lastSuccessfulSyncAt ? `上次同步 ${new Date(state.lastSuccessfulSyncAt).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", second: "2-digit" })}` : "尚未完成首次同步";
      $("#connection-banner").textContent = `画布连接暂时中断，当前内容已保留并正在自动恢复。${lastSync}${error ? "。" : ""}`;
    }
    async function refresh() {
      if (state.refreshInFlight) return false;
      state.refreshInFlight = true;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);
      try {
        const response = await fetch(surfaceUrl("/directorx/api/state", { visibility: document.visibilityState }), { cache: "no-store", signal: controller.signal });
        if (!response.ok) throw new Error("state unavailable");
        const data = await response.json();
        state.lastSuccessfulSyncAt = new Date().toISOString();
        render(data);
        return true;
      } catch (error) {
        updateConnectionState("disconnected", error);
        return false;
      } finally {
        clearTimeout(timeout);
        state.refreshInFlight = false;
      }
    }
    document.addEventListener("click", (event) => {
      const compare = event.target.closest("[data-compare-id]"); if (compare) { event.stopPropagation(); toggleCompare(compare.dataset.compareId); return; }
      const jump = event.target.closest("[data-jump-time]"); if (jump) { seekReviewTransport(Number(jump.dataset.jumpTime)); return; }
      const timeline = event.target.closest("[data-timeline-time]"); if (timeline) { seekReviewTransport(Number(timeline.dataset.timelineTime)); return; }
      const reviewAction = event.target.closest("[data-review-action]"); if (reviewAction) { commandReviewTransport(reviewAction.dataset.reviewAction); return; }
      const timelineAction = event.target.closest("[data-timeline-action]"); if (timelineAction) { navigateTimeline(timelineAction.dataset.timelineAction); return; }
      const evidence = event.target.closest("[data-evidence-time]"); if (evidence) { seekEvidence(evidence.dataset.evidenceTargetNode, evidence.dataset.evidenceTargetArtifact, Number(evidence.dataset.evidenceTime)); return; }
      if (event.target.closest("#sync-toggle")) { state.syncLeader = null; state.syncLocked = !state.syncLocked; state.reviewSignature = null; persistUiState(); renderReview(); return; }
      const target = event.target.closest("[data-node-id]"); if (target) selectNode(target.dataset.nodeId);
    });
    document.addEventListener("submit", (event) => {
      if (event.target.id === "review-note-form") void submitReviewNote(event);
    });
    document.querySelectorAll("[data-view]").forEach((button) => button.addEventListener("click", () => { state.view = button.dataset.view; state.filter = ["media", "storyboard", "review"].includes(state.view) ? "asset" : "all"; applyViewState(); persistUiState(); renderObjectList(); renderGraph(); renderMediaBoard(); }));
    document.querySelectorAll("[data-filter]").forEach((button) => button.addEventListener("click", () => { state.filter = button.dataset.filter; applyViewState(); persistUiState(); renderObjectList(); }));
    $("#search").addEventListener("input", (event) => { state.query = event.target.value; persistUiState(); renderObjectList(); });
    $("#fit").addEventListener("click", fitCanvas); $("#zoom-in").addEventListener("click", () => { const rect = $("#viewport").getBoundingClientRect(); zoomAroundPoint(Math.min(1.6, state.transform.zoom + .1), rect.left + rect.width / 2, rect.top + rect.height / 2); }); $("#zoom-out").addEventListener("click", () => { const rect = $("#viewport").getBoundingClientRect(); zoomAroundPoint(Math.max(.25, state.transform.zoom - .1), rect.left + rect.width / 2, rect.top + rect.height / 2); });
    $("#credential-toggle").addEventListener("click", openCredentialPanel); $("#close-inspector").addEventListener("click", () => $("#inspector").classList.remove("open"));
    $("#rail-toggle").addEventListener("click", () => $(".rail").classList.toggle("open"));
    $("#viewport").addEventListener("wheel", (event) => { event.preventDefault(); const next = Math.min(1.6, Math.max(.25, state.transform.zoom - Math.sign(event.deltaY) * .07)); zoomAroundPoint(next, event.clientX, event.clientY); }, { passive: false });
    $("#viewport").addEventListener("pointerdown", (event) => { if (event.target.closest(".node")) return; state.dragging = true; state.pointer = { x: event.clientX, y: event.clientY, originX: state.transform.x, originY: state.transform.y }; $("#viewport").classList.add("dragging"); $("#viewport").setPointerCapture(event.pointerId); });
    $("#viewport").addEventListener("pointermove", (event) => { if (!state.dragging) return; state.transform.x = state.pointer.originX + event.clientX - state.pointer.x; state.transform.y = state.pointer.originY + event.clientY - state.pointer.y; updateTransform(); });
    function finishPan() { if (!state.dragging) return; state.dragging = false; state.pointer = null; $("#viewport").classList.remove("dragging"); persistViewport(); }
    $("#viewport").addEventListener("pointerup", finishPan); $("#viewport").addEventListener("pointercancel", finishPan);
    document.addEventListener("visibilitychange", () => void surfaceHeartbeat("visibilitychange"));
    window.addEventListener("pagehide", () => { void flushUiState(); void surfaceHeartbeat("pagehide"); });
    refresh().then(() => { if (!state.viewportRestored) setTimeout(fitCanvas, 60); bindComparePlayers(); });
    void surfaceHeartbeat("boot");
    setInterval(() => void refresh(), 1200);
    setInterval(() => void surfaceHeartbeat("heartbeat"), 5000);
  </script>
