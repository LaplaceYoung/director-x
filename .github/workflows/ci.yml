name: Validate Director X plugin

on:
  push:
    branches: [main]
    paths:
      - ".codex-plugin/**"
      - "app/**"
      - "remotion/**"
      - "runtime/**"
      - "scripts/**"
      - "skills/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - "README.zh-CN.md"
      - "LICENSE"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - ".codex-plugin/**"
      - "app/**"
      - "remotion/**"
      - "runtime/**"
      - "scripts/**"
      - "skills/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - "README.zh-CN.md"
      - "LICENSE"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate plugin
        run: npm run ci
