name: Validate Director X plugin

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Validate manifest and marketplace
        run: pnpm validate:plugin

      - name: Check runtime syntax
        run: pnpm check

      - name: Run regression suite
        run: pnpm test

      - name: Check patch whitespace
        run: git diff --check
